<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly League — The HCA Daily</title>
<meta name="theme-color" content="#0b2545">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0b2545; --navy2:#13315c; --coral:#ff5749; --amber:#f59e0b; --green:#16a34a;
    --slate:#94a3b8; --off:#faf9f6; --ink:#14181f; --muted:#5b6572; --line:#e6e3dd }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--off);line-height:1.5}
  h1,h2,h3{font-family:'Sora',sans-serif}
  .mono{font-family:'IBM Plex Mono',monospace}
  header{background:linear-gradient(168deg,#0b2545,#13315c);color:#fff;padding:32px 0 28px}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .logo{font-family:'Sora',sans-serif;font-weight:800;color:#fff;text-decoration:none;font-size:17px}.logo span{color:var(--coral)}
  .back{color:#c2cfe0;font-size:14px;text-decoration:none}
  header h1{color:#fff;font-size:26px;font-weight:800}
  header .sub{color:#8ca2bd;font-size:14px;margin-top:4px}
  main{padding:26px 0 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
  .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--coral);font-weight:700;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .rank{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;background:#f1f5f9;color:var(--navy)}
  .rank.top1{background:#fef3c7;color:#b45309}.rank.top2{background:#e2e8f0;color:#475569}.rank.top3{background:#ffedd5;color:#9a3412}
  .nm{flex:1;font-weight:600;color:var(--navy);font-size:14.5px}
  .xp{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--amber);font-size:14.5px}
  .me{background:#fffaf7;border:2px solid var(--coral)}
  .you-chip{font-size:10px;font-weight:700;background:var(--coral);color:#fff;padding:2px 8px;border-radius:10px;margin-left:6px}
  .big{text-align:center;padding:10px 0}
  .big .n{font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:700;color:var(--navy)}
  .big .l{color:var(--muted);font-size:13px;margin-top:2px}
  .empty{text-align:center;color:var(--muted);padding:20px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="nav-row">
      <a class="logo" href="/">The HCA <span>Daily</span></a>
      <a class="back" href="/learn">← Today's drill</a>
    </div>
    <h1>Weekly League</h1>
    <p class="sub">A small, friendly cohort. Stack XP this week — nobody gets embarrassed for showing up.</p>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="card" id="meCard"></div>
    <div class="card"><div class="eyebrow">This week's board</div><div id="board"></div></div>
  </div>
</main>
<script>
  const uid = () => new URLSearchParams(location.search).get("u") || localStorage.getItem("hcaUid") || "";
  async function render(){
    const u = uid();
    const r = await fetch("/api/league?id="+encodeURIComponent(u));
    const d = await r.json();
    const me = document.getElementById("meCard");
    if(d.myRank){
      me.innerHTML = `<div class="big"><div class="n">#${d.myRank}</div><div class="l">your rank this week · <span class="mono" style="color:var(--amber)">${d.myXp} XP</span></div></div>`;
    } else {
      me.innerHTML = `<p class="empty">Finish a drill to earn XP and join the board.</p>`;
    }
    const board = document.getElementById("board");
    if(!d.top || d.top.length===0){ board.innerHTML = `<p class="empty">No one's on the board yet this week — be first.</p>`; return; }
    board.innerHTML = d.top.map(r=>{
      const isMe = (r.userId === u);
      return `<div class="row ${isMe?'me':''}"><span class="rank ${r.rank<=3?'top'+r.rank:''}">${r.rank}</span><span class="nm">${r.name}${isMe?'<span class="you-chip">YOU</span>':''}</span><span class="xp">${r.xpWeek} XP</span></div>`;
    }).join("");
  }
  render();
</script>
</body>
</html>
