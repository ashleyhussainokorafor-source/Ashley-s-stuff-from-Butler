<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice — The HCA Daily</title>
<meta name="theme-color" content="#0b2545">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="/lessons/part-resume-linkedin.js"></script>
<script src="/lessons/part-vocab.js"></script>
<script src="/lessons/part-interview.js"></script>
<script src="/lessons/part-offer.js"></script>
<script src="/lessons/lessons.js"></script>
<style>
  :root{ --navy:#0b2545; --navy2:#13315c; --coral:#ff5749; --amber:#f59e0b; --green:#16a34a;
    --slate:#94a3b8; --violet:#7c3aed; --off:#faf9f6; --ink:#14181f; --muted:#5b6572; --line:#e6e3dd }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--off);line-height:1.5}
  h1,h2,h3{font-family:'Sora',sans-serif}
  .mono{font-family:'IBM Plex Mono',monospace}
  header{background:linear-gradient(168deg,#0b2545,#13315c);color:#fff;padding:32px 0 28px}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .logo{font-family:'Sora',sans-serif;font-weight:800;color:#fff;text-decoration:none;font-size:17px}
  .logo span{color:var(--coral)}
  .back{color:#c2cfe0;font-size:14px;text-decoration:none}
  header h1{color:#fff;font-size:26px;font-weight:800}
  header .sub{color:#8ca2bd;font-size:14px;margin-top:4px;max-width:520px}
  main{padding:26px 0 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}
  .eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--coral);font-weight:700;margin-bottom:12px}
  .skill{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .skill:last-child{border-bottom:none}
  .skill .nm{font-weight:700;color:var(--navy);font-size:15px}
  .skill .sc{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--navy);font-size:15px}
  .skill .sc.low{color:var(--rose,#ef4444)} .skill .sc.mid{color:var(--amber)} .skill .sc.hi{color:var(--green)}
  .flag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:10px}
  .flag.review{background:rgba(245,158,11,.14);color:#b45309}
  .flag.ok{background:#f0fdf4;color:#15803d}
  .track{height:8px;border-radius:4px;background:#e6e3dd;margin-top:6px;overflow:hidden}
  .fill{height:100%;border-radius:4px;width:0}
  .btn{display:inline-block;background:var(--coral);color:#fff;font-weight:700;font-size:14.5px;padding:12px 24px;border-radius:12px;text-decoration:none}
  .btn.sec{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .unit{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
  .unit:last-child{border-bottom:none}
  .unit .t{font-weight:600;color:var(--navy);font-size:14.5px}
  .unit .dt{font-size:11.5px;color:var(--muted);margin-top:1px}
  .redrill{font-size:13px;font-weight:600;color:var(--coral);text-decoration:none}
  .empty{text-align:center;color:var(--muted);padding:20px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="nav-row">
      <a class="logo" href="/">The HCA <span>Daily</span></a>
      <a class="back" href="/learn">← Today's drill</a>
    </div>
    <h1>Practice</h1>
    <p class="sub">Retrieval is the point — skills fade if you don't recall them. Here's what to revive.</p>
  </div>
</header>
<main>
  <div class="wrap" id="root"></div>
</main>

<script>
  const uid = () => new URLSearchParams(location.search).get("u") || localStorage.getItem("hcaUid") || "";
  const DIMS = { resume:"Resume Metrics", vocabulary:"Operational Vocabulary", linkedin:"LinkedIn & Visibility", interview:"Interview Readiness" };
  const COLORS = { resume:"var(--coral)", vocabulary:"var(--amber)", linkedin:"#0d9488", interview:"var(--navy)" };
  function lvl(v){ return v>=70?"hi":v>=45?"mid":"low"; }

  async function render(){
    let user = null;
    const u = uid();
    if(u){
      try{ const r = await fetch("/api/user?id="+encodeURIComponent(u)); if(r.ok){ const j=await r.json(); user=j.user; } }catch(e){}
    }
    const root = document.getElementById("root");
    if(!user || !user.dimensions){ root.innerHTML = `<div class="card empty">Take the scorecard first to see what needs practice. <a href="/scorecard" style="color:var(--coral)">Start →</a></div>`; return; }

    const dims = user.dimensions||{};
    const entries = Object.keys(DIMS).map(k=>({k, v: Math.round(dims[k]||0)})).sort((a,b)=>a.v-b.v);
    const weakest = entries[0];
    const path = user.path||{};

    // find the first unresolved unit in the weakest dimension
    const weakestDim = weakest.k;
    const reviewUnit = (window.HCA_UNITS||[]).find(x => x.dim===weakestDim && !path[x.id]?.mastered) ||
                       (window.HCA_UNITS||[]).find(x => x.dim===weakestDim);

    let html = "";
    // weakest skill hero
    html += `<div class="card">
      <div class="eyebrow">Your highest-leverage fix</div>
      <h3 style="color:var(--navy);margin-bottom:4px">${DIMS[weakestDim]}</h3>
      <div class="mono" style="font-size:28px;font-weight:700;color:var(--navy)">${weakest.v}<span style="font-size:15px;color:var(--muted)">/100</span></div>
      <p style="color:var(--muted);font-size:13.5px;margin:8px 0 14px">"${DIMS[weakestDim]}" is your biggest gap. Reviving it moves your score fastest.</p>
      ${reviewUnit ? `<a class="btn" href="/learn?u=${encodeURIComponent(u)}&unit=${reviewUnit.id}">Practice ${DIMS[weakestDim]} →</a>` : ""}
    </div>`;

    // all dimensions
    html += `<div class="card"><div class="eyebrow">Skill strength</div>`;
    entries.forEach(({k,v})=>{
      const state = lvl(v);
      html += `<div class="skill">
        <span class="nm">${DIMS[k]}</span>
        <span class="sc ${state}">${v}</span>
        ${state!=="hi" ? `<span class="flag review">NEEDS REVIEW</span>` : `<span class="flag ok">STEADY</span>`}
      </div>
      <div class="track"><div class="fill" style="width:${v}%;background:${COLORS[k]}"></div></div>`;
    });
    html += `</div>`;

    // mastered units to re-drill
    const mastered = (window.HCA_UNITS||[]).filter(x => path[x.id]?.mastered);
    html += `<div class="card"><div class="eyebrow">Mastered units</div>`;
    if(mastered.length===0){
      html += `<p class="empty">Nothing mastered yet — finish your first unit to unlock spaced review.</p>`;
    } else {
      mastered.forEach(x => {
        const dt = (path[x.id]?.at||"").slice(0,10);
        html += `<div class="unit"><div><div class="t">${x.title}</div><div class="dt">mastered ${dt}</div></div><a class="redrill" href="/learn?u=${encodeURIComponent(u)}&unit=${x.id}">Re-drill →</a></div>`;
      });
    }
    html += `</div>`;

    root.innerHTML = html;
  }
  render();
</script>
</body>
</html>
